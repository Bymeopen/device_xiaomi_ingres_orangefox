name: Build OrangeFox Recovery (ingres)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'PRD.md'
      - '.gitignore'

jobs:
  build:
    name: Build OrangeFox fox_14.1 for POCO F4 GT (ingres)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Maximize Free Disk Space
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h /
          
          echo "Stopping unnecessary services..."
          sudo systemctl stop docker || true
          
          echo "Removing unneeded toolchains, runtimes, and caches..."
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /etc/mysql /var/lib/mysql
          sudo rm -rf /var/lib/docker
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo apt-get clean
          sudo journalctl --vacuum-time=1s || true
          
          echo "=== Disk Space After Cleanup ==="
          df -h /

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 \
            rsync bc libssl-dev openjdk-11-jdk patch schedtool
          
          # Install repo tool
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo
          
          # Git config for repo sync
          git config --global user.name "Bymeopen"
          git config --global user.email "byme.openwrt@gmail.com"

      - name: Sync OrangeFox Source (fox_14.1)
        run: |
          git clone https://github.com/Just-TWRP/OrangeFox_sync.git $HOME/OrangeFox_sync
          cd $HOME/OrangeFox_sync
          
          # 1. Fix DEVICE_BRANCH to android-14.1 for qcom common repo
          sed -i 's/DEVICE_BRANCH="android-14"/DEVICE_BRANCH="android-14.1"/g' orangefox_sync.sh
          
          # 2. Optimize repo init with shallow clone and omit darwin/macOS toolchains
          sed -i 's/repo init --depth=1 -u $MIN_MANIFEST -b $TWRP_BRANCH/repo init --depth=1 -u $MIN_MANIFEST -b $TWRP_BRANCH -g default,-darwin,-notdefault/g' orangefox_sync.sh
          
          # 3. Optimize repo sync with branch filter, no clone bundles, and no tags
          sed -i 's/repo sync -j25/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune/g' orangefox_sync.sh
          
          # 4. Use shallow clone (--depth=1) for recovery and vendor repos
          sed -i 's/git clone $URL -b $BRANCH recovery/git clone --depth=1 $URL -b $BRANCH recovery/g' orangefox_sync.sh
          sed -i 's/git clone https:\/\/github.com\/TeamWin\/android_device_qcom_common -b $DEVICE_BRANCH device\/qcom\/common/git clone --depth=1 https:\/\/github.com\/TeamWin\/android_device_qcom_common -b $DEVICE_BRANCH device\/qcom\/common/g' orangefox_sync.sh
          sed -i 's/git clone https:\/\/github.com\/TeamWin\/android_device_qcom_twrp-common -b $DEVICE_BRANCH device\/qcom\/twrp-common/git clone --depth=1 https:\/\/github.com\/TeamWin\/android_device_qcom_twrp-common -b $DEVICE_BRANCH device\/qcom\/twrp-common/g' orangefox_sync.sh
          
          echo "Running optimized OrangeFox sync script..."
          ./orangefox_sync.sh --branch 14.1 --path $HOME/fox_14.1
          
          echo "Reclaiming disk space by removing .repo metadata directory..."
          rm -rf $HOME/fox_14.1/.repo
          
          echo "=== Disk Space After Sync & .repo Cleanup ==="
          df -h /

      - name: Place Device Tree
        run: |
          mkdir -p $HOME/fox_14.1/device/xiaomi/ingres
          cp -rf device_tree/* $HOME/fox_14.1/device/xiaomi/ingres/
          rm -rf $HOME/fox_14.1/device/xiaomi/ingres/.git

      - name: Compile OrangeFox Recovery
        run: |
          cd $HOME/fox_14.1
          source build/envsetup.sh
          source device/xiaomi/ingres/vendorsetup.sh || true
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          lunch twrp_ingres-ap2a-eng
          mka adbd recoveryimage -j$(nproc --all)

      - name: Collect Recovery Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          OUT_DIR="$HOME/fox_14.1/out/target/product/ingres"
          if [ -d "$OUT_DIR" ]; then
            find "$OUT_DIR" -maxdepth 2 -name "*.img" -exec cp -v {} artifacts/ \; || true
            find "$OUT_DIR" -maxdepth 2 -name "OrangeFox*.zip" -exec cp -v {} artifacts/ \; || true
            find "$OUT_DIR" -maxdepth 2 -name "OrangeFox*.zip.md5" -exec cp -v {} artifacts/ \; || true
          fi
          cd artifacts
          if [ -n "$(ls -A . 2>/dev/null)" ]; then
            sha256sum * > SHA256SUMS.txt || true
            ls -la
          else
            echo "No artifacts generated."
          fi

      - name: Upload Recovery Artifacts (Non-Release)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OrangeFox-Recovery-ingres-non-release
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 7
